# Local Supabase CLI configuration. Hosted application is a separate, verified local-Codex step.
project_id = "thrift-log"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = false
[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "5MiB"
